name: Build and Push to ECR

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ECR_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-actions-ecr-role
  AWS_ECS_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-task-definition-role

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            repo: amazon-be
            context: .
            dockerfile: apps/api/Dockerfile
          - name: frontend
            repo: amazon-fe
            context: .
            dockerfile: apps/chatbot_ui/Dockerfile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ECR_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image.repo }}:${{ env.SHORT_SHA }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.image.repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.repo }}

  deploy-task-definitions:
    name: Build task definition (${{ matrix.service.name }})
    needs: build-and-push
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            script: scripts/ci/build_be_task_definition.py
          - name: frontend
            script: scripts/ci/build_fe_task_definition.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ECS_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ${{ matrix.service.name }} task definition script
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT }}
          API_URL: ${{ vars.API_URL }}
        run: python ${{ matrix.service.script }}